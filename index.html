<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker - DBMS Project</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header & Search Bar -->
    <header class="bg-emerald-700 text-white p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold">Personal Expense Tracker</h1>
        <p class="text-emerald-100 text-sm">DBMS Lab Project — Maked by MH Rafi</p>
      </div>
      <div class="flex gap-2 w-full md:w-auto">
        <input 
          type="text" 
          id="searchInput" 
          onkeyup="renderTable()" 
          placeholder="Search title or category..." 
          class="px-4 py-2 rounded-lg text-slate-800 w-full md:w-64 border focus:outline-none focus:ring-2 focus:ring-emerald-300"
        />
        <select id="categoryFilter" onchange="renderTable()" class="px-3 py-2 rounded-lg text-slate-800 border focus:outline-none">
          <option value="">All Categories</option>
          <option value="Food & Dining">Food & Dining</option>
          <option value="Transport">Transport</option>
          <option value="Utilities & Bills">Utilities & Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Education & Books">Education & Books</option>
        </select>
      </div>
    </header>

    <!-- Aggregate Functions Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-600">
        <p class="text-xs font-bold text-slate-400 uppercase">Total Expense (SUM)</p>
        <p id="totalSum" class="text-2xl font-extrabold text-slate-800 mt-1">৳ 0.00</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-600">
        <p class="text-xs font-bold text-slate-400 uppercase">Total Records (COUNT)</p>
        <p id="totalCount" class="text-2xl font-extrabold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-amber-500">
        <p class="text-xs font-bold text-slate-400 uppercase">Average Expense (AVG)</p>
        <p id="avgAmount" class="text-2xl font-extrabold text-slate-800 mt-1">৳ 0.00</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-rose-500">
        <p class="text-xs font-bold text-slate-400 uppercase">Highest Expense (MAX)</p>
        <p id="maxAmount" class="text-2xl font-extrabold text-slate-800 mt-1">৳ 0.00</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Add / Update Form -->
      <div class="bg-white p-6 rounded-xl shadow-sm border h-fit">
        <h2 id="formTitle" class="text-lg font-bold mb-4 text-emerald-700 border-b pb-2">Add New Expense</h2>
        <form id="expenseForm" onsubmit="saveExpense(event)" class="space-y-4">
          <input type="hidden" id="expenseId">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Expense Title</label>
            <input type="text" id="title" placeholder="e.g. Lunch, Bus Fare" required class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Category (Foreign Key Ref)</label>
            <select id="category" required class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
              <option value="Food & Dining">Food & Dining</option>
              <option value="Transport">Transport</option>
              <option value="Utilities & Bills">Utilities & Bills</option>
              <option value="Shopping">Shopping</option>
              <option value="Education & Books">Education & Books</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Amount (৳)</label>
            <input type="number" id="amount" step="0.01" min="1" placeholder="0.00" required class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Date</label>
            <input type="date" id="date" required class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-semibold transition">Save Expense</button>
            <button type="button" onclick="resetForm()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-slate-700 font-medium">Clear</button>
          </div>
        </form>
      </div>

      <!-- Records Table -->
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border overflow-hidden">
        <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
          <span class="font-bold text-slate-700">Expense History</span>
          <button onclick="resetDemoData()" class="text-xs text-slate-500 hover:text-emerald-700 underline">Reset 10 Sample Records</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-slate-600 border-b">
              <tr>
                <th class="p-3">ID</th>
                <th class="p-3">Title</th>
                <th class="p-3">Category</th>
                <th class="p-3">Date</th>
                <th class="p-3 text-right">Amount</th>
                <th class="p-3 text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="expenseTableBody" class="divide-y">
              <!-- Rows injected by JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 10 Sample Records matching schema.sql
    const initialExpenses = [
      { id: 1, title: "Lunch at University Canteen", category: "Food & Dining", amount: 150.00, date: "2026-11-01" },
      { id: 2, title: "Bus Fare to Campus", category: "Transport", amount: 60.00, date: "2026-11-01" },
      { id: 3, title: "Mobile Internet Package", category: "Utilities & Bills", amount: 399.00, date: "2026-11-02" },
      { id: 4, title: "DBMS Reference Book", category: "Education & Books", amount: 550.00, date: "2026-11-03" },
      { id: 5, title: "Evening Snacks & Tea", category: "Food & Dining", amount: 80.00, date: "2026-11-04" },
      { id: 6, title: "Rickshaw Fare", category: "Transport", amount: 50.00, date: "2026-11-05" },
      { id: 7, title: "Grocery & Fruits", category: "Food & Dining", amount: 620.00, date: "2026-11-06" },
      { id: 8, title: "New Earphones", category: "Shopping", amount: 850.00, date: "2026-11-08" },
      { id: 9, title: "Electricity Bill Share", category: "Utilities & Bills", amount: 1200.00, date: "2026-11-10" },
      { id: 10, title: "Lab Printout & Binding", category: "Education & Books", amount: 120.00, date: "2026-11-12" }
    ];

    function getExpenses() {
      const stored = localStorage.getItem('db_expenses');
      if (!stored) {
        localStorage.setItem('db_expenses', JSON.stringify(initialExpenses));
        return initialExpenses;
      }
      return JSON.parse(stored);
    }

    function saveToStorage(data) {
      localStorage.setItem('db_expenses', JSON.stringify(data));
      renderTable();
    }

    function renderTable() {
      const expenses = getExpenses();
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const catFilter = document.getElementById('categoryFilter').value;
      const tbody = document.getElementById('expenseTableBody');
      tbody.innerHTML = '';

      const filtered = expenses.filter(item => {
        const matchesText = item.title.toLowerCase().includes(searchQuery) || item.category.toLowerCase().includes(searchQuery);
        const matchesCat = catFilter === "" || item.category === catFilter;
        return matchesText && matchesCat;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">No matching expense records found.</td></tr>`;
      } else {
        filtered.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';
          tr.innerHTML = `
            <td class="p-3 font-semibold text-slate-500">#${item.id}</td>
            <td class="p-3 font-medium text-slate-800">${item.title}</td>
            <td class="p-3"><span class="px-2 py-1 bg-emerald-50 text-emerald-700 rounded-md text-xs font-semibold">${item.category}</span></td>
            <td class="p-3 text-slate-500">${item.date}</td>
            <td class="p-3 text-right font-bold text-slate-800">৳ ${parseFloat(item.amount).toFixed(2)}</td>
            <td class="p-3 text-center space-x-2">
              <button onclick="editExpense(${item.id})" class="text-blue-600 hover:underline text-xs font-semibold">Edit</button>
              <button onclick="deleteExpense(${item.id})" class="text-rose-600 hover:underline text-xs font-semibold">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      updateSummaries(expenses);
    }

    function updateSummaries(expenses) {
      const count = expenses.length;
      document.getElementById('totalCount').innerText = count;

      if (count === 0) {
        document.getElementById('totalSum').innerText = '৳ 0.00';
        document.getElementById('avgAmount').innerText = '৳ 0.00';
        document.getElementById('maxAmount').innerText = '৳ 0.00';
        return;
      }

      const amounts = expenses.map(e => parseFloat(e.amount));
      const sum = amounts.reduce((a, b) => a + b, 0);
      const avg = sum / count;
      const max = Math.max(...amounts);

      document.getElementById('totalSum').innerText = '৳ ' + sum.toFixed(2);
      document.getElementById('avgAmount').innerText = '৳ ' + avg.toFixed(2);
      document.getElementById('maxAmount').innerText = '৳ ' + max.toFixed(2);
    }

    function saveExpense(event) {
      event.preventDefault();
      const id = document.getElementById('expenseId').value;
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const date = document.getElementById('date').value;

      let expenses = getExpenses();

      if (id) {
        expenses = expenses.map(e => e.id == id ? { id: parseInt(id), title, category, amount, date } : e);
      } else {
        const newId = expenses.length > 0 ? Math.max(...expenses.map(e => e.id)) + 1 : 1;
        expenses.push({ id: newId, title, category, amount, date });
      }

      saveToStorage(expenses);
      resetForm();
    }

    function editExpense(id) {
      const item = getExpenses().find(e => e.id === id);
      if (item) {
        document.getElementById('expenseId').value = item.id;
        document.getElementById('title').value = item.title;
        document.getElementById('category').value = item.category;
        document.getElementById('amount').value = item.amount;
        document.getElementById('date').value = item.date;
        document.getElementById('formTitle').innerText = 'Update Expense Record (#' + item.id + ')';
      }
    }

    function deleteExpense(id) {
      if (confirm('Are you sure you want to delete this expense record?')) {
        const expenses = getExpenses().filter(e => e.id !== id);
        saveToStorage(expenses);
      }
    }

    function resetForm() {
      document.getElementById('expenseId').value = '';
      document.getElementById('expenseForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('formTitle').innerText = 'Add New Expense';
    }

    function resetDemoData() {
      if (confirm('Reset all data back to the default 10 sample records?')) {
        saveToStorage(initialExpenses);
      }
    }

    window.onload = () => {
      document.getElementById('date').valueAsDate = new Date();
      renderTable();
    };
  </script>
</body>
</html>
